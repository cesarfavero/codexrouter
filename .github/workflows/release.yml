name: Release macOS app

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm test && npm run check && npm run desktop:typecheck
      - name: Build macOS package
        run: npm run desktop:package:mac
      - name: Create checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt --title "CodexRouter ${GITHUB_REF_NAME#v}" --generate-notes
