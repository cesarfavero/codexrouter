name: Release desktop apps

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm test && npm run check && npm run desktop:typecheck
      - name: Build macOS package
        run: npm run desktop:package:mac
      - name: Create checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt --title "CodexRouter ${GITHUB_REF_NAME#v}" --generate-notes

  windows:
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows installer
        run: npm run desktop:package:win
      - name: Verify update metadata and create checksum
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/codexrouter-$version-win-x64.exe"
          if (-not (Test-Path $installer)) { throw "Missing Windows installer: $installer" }
          if (-not (Test-Path "${installer}.blockmap")) { throw "Missing Windows blockmap" }
          if (-not (Test-Path release/latest.yml)) { throw "Missing Windows update manifest" }
          $manifest = Get-Content release/latest.yml -Raw
          if (-not $manifest.Contains("codexrouter-$version-win-x64.exe")) { throw "Update manifest does not reference the installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Out-File release/SHA256SUMS-win.txt -Encoding utf8NoBOM
      - name: Publish Windows update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/codexrouter-$version-win-x64.exe"
          gh release upload $env:GITHUB_REF_NAME $installer "${installer}.blockmap" release/latest.yml release/SHA256SUMS-win.txt
